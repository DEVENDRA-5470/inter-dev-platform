services:
  postgres:
    image: postgres:16
    container_name: idp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: idp_user
      POSTGRES_PASSWORD: idp_password
      POSTGRES_DB: idp_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: